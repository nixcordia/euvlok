name: Set up Nix
description: Install Nix and configure Cachix for repository workflows.

inputs:
  github-token:
    description: GitHub token used by the Nix installer for GitHub fetches.
    required: false
    default: ""
  cachix-cache:
    description: Cachix cache name.
    required: false
    default: euvlok
  extra-cachix-caches:
    description: Additional Cachix cache names used as substituters.
    required: false
    default: devenv,eupkgs,hyprland,nix-community,nixos-raspberrypi
  cachix-auth-token:
    description: Cachix auth token used to push build results.
    required: false
    default: ""
  cachix-skip-push:
    description: Only use Cachix as a substituter without pushing build results.
    required: false
    default: "true"
  extra-nix-config:
    description: Additional Nix configuration appended to the installer config.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb  # v3.21.8
      with:
        github-token: ${{ inputs.github-token }}
        extra-conf: |
          accept-flake-config = true
          extra-substituters = https://cache.flox.dev https://cache.nixos-cuda.org
          extra-trusted-public-keys = flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
          ${{ inputs.extra-nix-config }}

    - name: Configure Cachix
      id: cachix
      continue-on-error: true
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
      with:
        name: ${{ inputs.cachix-cache }}
        extraPullNames: ${{ inputs.extra-cachix-caches }}
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.cachix-skip-push }}

    - name: Report Cachix configuration failure
      if: steps.cachix.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Cachix setup failed. Continuing without pushing build results; rotate CACHIX_AUTH_TOKEN to restore pushes."

    - name: Configure supplemental binary caches
      shell: bash
      run: | # zizmor: ignore[github-env] RUNNER_TEMP supplies the generated configuration path.
        supplemental_nix_config="${RUNNER_TEMP}/supplemental-nix.conf"

        {
          echo "extra-substituters = https://cache.flox.dev https://cache.nixos-cuda.org"
          echo "extra-trusted-public-keys = flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M="
        } > "${supplemental_nix_config}"

        export NIX_USER_CONF_FILES="${supplemental_nix_config}:${NIX_USER_CONF_FILES}"
        echo "NIX_USER_CONF_FILES=${NIX_USER_CONF_FILES}" >> "${GITHUB_ENV}"

    - name: Show Nix cache configuration
      shell: bash
      run: |
        nix_version="$(nix --version)"
        echo "${nix_version}"

        case "${nix_version}" in
          "nix (Determinate Nix "*) ;;
          *)
            echo "::error::Expected Determinate Nix, got: ${nix_version}"
            exit 1
            ;;
        esac

        nix config show | sed -n \
          '/^eval-cores = /p;/^lazy-trees = /p;/^substituters = /p;/^trusted-public-keys = /p'
