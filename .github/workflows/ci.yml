name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "renovate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check README links
        # v2.9.0
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --no-progress --verbose --exclude '^https://nixos.org/manual/nixpkgs/stable/?$' README.md
          fail: true

  typescript:
    name: TypeScript 7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Bun
        # v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install pinned dependencies
        working-directory: .github/actions/build-nix-flake-target
        run: bun install --frozen-lockfile

      - name: Type-check and lint with TypeScript 7
        working-directory: .github/actions/build-nix-flake-target
        run: bun run check

      - name: Run build helper tests
        working-directory: .github/actions/build-nix-flake-target
        run: bun run test

      - name: Verify bundle generation
        working-directory: .github/actions/build-nix-flake-target
        run: bun run build

  flake:
    name: Flake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: >-
            ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          cachix-skip-push: >-
            ${{ github.event_name == 'pull_request' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Evaluate all flake outputs and run checks
        run: nix --option eval-cores 1 flake check --all-systems

  development:
    name: Development (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: >-
            ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          cachix-skip-push: >-
            ${{ github.event_name == 'pull_request' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Run development checks
        run: nix run nixpkgs#devenv -- test
